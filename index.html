@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Barlow+Condensed:wght@500;600;700&display=swap');
:root{
  --navy:#162d49;--navy2:#213f67;--navy3:#2d5a8e;
  --blue:#2D7DD2;--bl:#deeaf6;--bp:#eef5fb;
  --grn:#1a6e3a;--grnl:#e6f4ec;--grnb:#8ecfa8;
  --red:#c0392b;--redl:#fde8e8;
  --yel:#7a5200;--yell:#fff8e6;--yelb:#f0c860;
  --ora:#e07b20;--oral:#fff3e6;--orab:#f5c490;
  --pur:#5a0080;
  --txt:#0f1c2e;--mid:#2d4060;--mut:#607898;
  --brd:#c8dbed;--pale:#eef5fb;--bg:#e2eaf4;--wh:#fff;
  --f:'DM Sans',Segoe UI,Arial,sans-serif;--fn:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--ft:'Syne','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--f);background:var(--bg);color:var(--txt);font-size:13px;min-height:100vh;}
/* HDR */
.hdr{background:var(--navy);padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(255,255,255,.07);}
.hdr-l{display:flex;align-items:center;gap:10px;padding:8px 0;}
.hdr-logo{height:32px;width:auto;}
.hdr-nm{font-family:var(--ft);font-size:13px;font-weight:800;color:#deeaf6;letter-spacing:.05em;}
.hdr-sb{font-size:9px;color:#5a80a8;}
.vsep{width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 4px;}
.nav{display:flex;gap:1px;}
.nb{font-family:var(--f);font-size:12px;font-weight:600;border:none;padding:7px 12px;cursor:pointer;border-radius:6px;color:#7aaace;background:transparent;transition:all .15s;display:flex;align-items:center;gap:5px;}
.nb:hover{background:rgba(255,255,255,.07);color:#deeaf6;}
.nb.on{background:rgba(45,125,210,.22);color:#7fc3f5;}
.hdr-r{display:flex;align-items:center;gap:7px;}
.dbadge{background:rgba(45,125,210,.2);border:1px solid rgba(45,125,210,.35);color:#7fc3f5;font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap;}
.hdr-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#7aaace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:var(--f);display:flex;align-items:center;gap:4px;transition:all .15s;}
.hdr-btn:hover{background:rgba(255,255,255,.13);color:#fff;}
.hdr-btn.on{color:#3dbb7c;border-color:rgba(61,187,124,.3);background:rgba(61,187,124,.1);}
.hdr-btn.drive{color:#f0b429;border-color:rgba(240,180,41,.3);background:rgba(240,180,41,.08);}
.hdr-btn.drive.synced{color:#3dbb7c;border-color:rgba(61,187,124,.3);background:rgba(61,187,124,.08);}
/* PAGE */
.pg{padding:16px 18px;}
/* BTNS */
.btn{font-family:var(--f);font-size:12px;font-weight:600;border:none;border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;}
.btn-p{background:var(--blue);color:#fff;}.btn-p:hover{background:#2269b5;}
.btn-g{background:var(--pale);color:var(--navy3);border:1px solid var(--brd);}.btn-g:hover{background:var(--bl);}
.btn-d{background:var(--redl);color:var(--red);border:1px solid #f5b0b0;}.btn-d:hover{background:var(--red);color:#fff;}
.btn-o{background:var(--oral);color:var(--ora);border:1px solid var(--orab);}.btn-o:hover{background:var(--ora);color:#fff;}
.btn-grn{background:var(--grnl);color:var(--grn);border:1px solid var(--grnb);}.btn-grn:hover{background:var(--grn);color:#fff;}
.btn-sm{padding:4px 9px;font-size:11px;}
.wbtn{background:#25d366;color:#fff;font-size:11px;padding:3px 9px;border-radius:6px;border:none;cursor:pointer;font-family:var(--f);font-weight:600;display:inline-flex;align-items:center;gap:3px;transition:all .15s;white-space:nowrap;}
.wbtn:hover{background:#1eab52;}.wbtn:disabled{background:var(--brd);color:var(--mut);cursor:not-allowed;}
/* SUMMARY */
.srow{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap;}
.sc{background:var(--wh);border:1px solid var(--brd);border-radius:9px;padding:10px 14px;flex:1;min-width:100px;}
.srow-wrap{overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1),opacity .3s ease;max-height:0;opacity:0;}
.srow-wrap.open{max-height:200px;opacity:1;}
.hdr-logo{height:32px;width:auto;cursor:pointer;transition:opacity .18s;user-select:none;}
.hdr-logo:hover{opacity:.82;}
.sc-l{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:4px;}
.sc-v{font-family:var(--fn);font-size:22px;font-weight:700;color:var(--txt);}
.sc-n{font-size:10px;color:var(--mut);margin-top:2px;}
/* TABLE */
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--brd);background:var(--wh);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead tr{background:var(--pale);}
th{padding:8px 10px;text-align:left;font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}
td{padding:7px 10px;border-top:1px solid var(--brd);color:var(--txt);vertical-align:middle;}
tr.ctr{cursor:pointer;}
tr.ctr:hover td{background:#f7faff;}
.cod{font-family:var(--fn);font-size:15px;font-weight:700;color:var(--mut);}
.cn{font-weight:700;font-size:12.5px;line-height:1.3;}
.rc{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;}
.rc span{font-size:9.5px;background:var(--pale);color:var(--navy3);border:1px solid var(--brd);border-radius:7px;padding:1px 6px;}
.sl{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.si{background:var(--pale);border:1px solid var(--brd);border-radius:5px;padding:2px 6px;display:flex;align-items:center;height:24px;}
.si img{height:13px;max-width:54px;object-fit:contain;}
.cd{display:flex;flex-direction:column;gap:1px;}
.ct{font-family:var(--fn);font-size:14px;font-weight:700;color:var(--navy2);}
.cs{font-size:10px;color:var(--mut);}
/* TAGS */
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;border:1.5px solid;white-space:nowrap;}
.t-pm{background:#e8f2fb;border-color:#80b4e0;color:#1a4f8a;}
.t-ps{background:var(--yell);border-color:var(--yelb);color:var(--yel);}
.t-bo{background:var(--grnl);border-color:var(--grnb);color:var(--grn);}
.t-sc{background:var(--pale);border-color:var(--brd);color:var(--mut);}
.t-warn{background:var(--yell);border-color:var(--yelb);color:var(--yel);}
.t-ok{background:var(--grnl);border-color:var(--grnb);color:var(--grn);}
.t-no{background:var(--redl);border-color:#f5b0b0;color:var(--red);}
/* CERT TAGS */
.cert-ok{background:var(--grnl);border:1.5px solid var(--grnb);color:var(--grn);display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.cert-warn{background:var(--yell);border:1.5px solid var(--yelb);color:var(--yel);display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.cert-crit{background:var(--oral);border:1.5px solid var(--orab);color:var(--ora);display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;cursor:pointer;}
.cert-exp{background:var(--redl);border:1.5px solid #f5b0b0;color:var(--red);display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;cursor:pointer;}
/* XML BTN */
.xml-btn{font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px;border:none;cursor:pointer;font-family:var(--f);display:inline-flex;align-items:center;gap:4px;transition:all .15s;}
.xml-pend{background:var(--oral);color:var(--ora);border:1px solid var(--orab);}
.xml-pend:hover{background:var(--ora);color:#fff;}
.xml-done{background:var(--grnl);color:var(--grn);border:1px solid var(--grnb);}
.xml-done:hover{background:var(--grn);color:#fff;}
/* TOOLBAR */
.tb{display:flex;gap:9px;margin-bottom:11px;align-items:center;flex-wrap:wrap;}
.srch{display:flex;align-items:center;gap:6px;background:var(--wh);border:1.5px solid var(--brd);border-radius:7px;padding:5px 10px;flex:1;min-width:170px;}
.srch input{border:none;outline:none;font-family:var(--f);font-size:12.5px;color:var(--txt);width:100%;background:transparent;}
.chips{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;cursor:pointer;border:1.5px solid var(--brd);background:var(--wh);color:var(--mut);transition:all .15s;}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.chip:hover:not(.on){background:var(--pale);}
/* EXPANDED ROW */
.exp-row td{padding:0;background:#f7fbff;}
.exp-panel{padding:14px 18px;border-top:2px solid var(--blue);display:grid;grid-template-columns:160px 1fr 1fr;gap:18px;}
.exp-logo-ph{width:150px;height:90px;border:2px dashed var(--brd);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--mut);font-size:11px;text-align:center;transition:all .15s;background:var(--wh);}
.exp-logo-ph:hover{border-color:var(--blue);color:var(--blue);background:var(--pale);}
.exp-logo-img{width:150px;height:90px;border-radius:8px;background:var(--pale);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.exp-logo-img img{max-width:140px;max-height:80px;object-fit:contain;}
.folder-btn{font-size:10px;font-weight:600;color:var(--navy3);background:var(--pale);border:1px solid var(--brd);border-radius:5px;padding:3px 9px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:var(--f);transition:all .15s;width:100%;justify-content:center;margin-top:6px;}
.folder-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.exp-col{display:flex;flex-direction:column;gap:8px;}
.exp-sec{font-size:9px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid var(--brd);padding-bottom:3px;}
.exp-f{display:flex;flex-direction:column;gap:2px;}
.exp-fl{font-size:9px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.07em;}
.exp-fv{font-size:12.5px;color:var(--txt);}
/* PARCERIA */
.parc-block{background:var(--pale);border:1px solid var(--brd);border-radius:8px;padding:10px 12px;text-align:center;}
.parc-label{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:4px;}
.parc-date{font-family:var(--f);font-size:15px;font-weight:700;color:var(--navy2);letter-spacing:.01em;}
.parc-tempo{font-size:11px;color:var(--mut);margin-top:3px;font-style:italic;}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(11,26,46,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:14px;}
.modal{background:var(--wh);border-radius:12px;width:100%;max-width:600px;max-height:94vh;overflow-y:auto;box-shadow:0 8px 48px rgba(11,26,46,.25);}
.mhdr{padding:14px 18px 11px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;}
.mtit{font-family:var(--ft);font-size:15px;font-weight:700;}
.mbdy{padding:14px 18px;display:flex;flex-direction:column;gap:10px;}
.mftr{padding:10px 18px;border-top:1px solid var(--brd);display:flex;gap:8px;justify-content:flex-end;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg.full{grid-column:1/-1;}
.flbl{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;}
.fin,.fsel{font-family:var(--f);font-size:12.5px;color:var(--txt);background:var(--pale);border:1.5px solid var(--brd);border-radius:6px;padding:6px 10px;outline:none;width:100%;transition:all .15s;}
.fin:focus,.fsel:focus{border-color:var(--blue);background:#fff;}
.fin::placeholder{color:var(--mut);}
.sdiv{font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;padding:6px 0 3px;border-bottom:1px solid var(--brd);margin-bottom:3px;grid-column:1/-1;}
.sch-row{display:flex;gap:7px;flex-wrap:wrap;grid-column:1/-1;}
.sch{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1.5px solid var(--brd);border-radius:7px;cursor:pointer;background:var(--wh);transition:all .15s;user-select:none;}
.sch.on{border-color:var(--blue);background:var(--pale);}
.sch img{height:15px;max-width:58px;object-fit:contain;pointer-events:none;}
/* BILLING */
.bhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:9px;}
.mnav{display:flex;align-items:center;gap:9px;}
.mdisp{font-family:var(--ft);font-size:18px;font-weight:800;color:var(--txt);min-width:155px;text-align:center;}
.mnb{background:var(--wh);border:1px solid var(--brd);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--mut);font-size:14px;transition:all .15s;}
.mnb:hover{background:var(--pale);}
.alrt{border-radius:9px;padding:9px 13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:9px;font-size:12px;}
.a-w{background:var(--yell);border:1px solid var(--yelb);color:var(--yel);}
.a-g{background:var(--grnl);border:1px solid var(--grnb);color:var(--grn);}
.bcols{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.bsec{background:var(--wh);border-radius:10px;border:1px solid var(--brd);overflow:hidden;}
.bsh{padding:9px 13px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;}
.bst{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;}
.bitem{padding:7px 13px;border-top:1px solid var(--brd);display:flex;align-items:center;gap:7px;}
.bname{font-weight:600;font-size:12px;flex:1;}
.bresp{font-size:10px;color:var(--mut);}
.bval{font-family:var(--fn);font-size:14px;font-weight:700;color:var(--navy2);flex-shrink:0;}
.bfoot{padding:6px 13px;background:var(--pale);border-top:1px solid var(--brd);text-align:right;}
.ssel{font-family:var(--f);font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px;cursor:pointer;border:1.5px solid;outline:none;appearance:none;}
.s-p{background:var(--yell);border-color:var(--yelb);color:var(--yel);}
.s-e{background:#e8f2fb;border-color:#80b4e0;color:#1a4f8a;}
.s-ok{background:var(--grnl);border-color:var(--grnb);color:var(--grn);}
.s-at{background:var(--redl);border-color:#f5b0b0;color:var(--red);}
/* FINANCEIRO */
.fin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px;}
.fcrd{background:var(--wh);border:1px solid var(--brd);border-radius:9px;padding:11px 14px;}
.fcrd.dest{border-color:var(--blue);background:var(--pale);}
.fcrd-l{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:4px;}
.fcrd-v{font-family:var(--fn);font-size:21px;font-weight:700;}
.fcrd-n{font-size:10px;color:var(--mut);margin-top:2px;}
.lanc-row{padding:8px 13px;border-top:1px solid var(--brd);display:grid;grid-template-columns:8px 1fr auto auto auto;gap:9px;align-items:center;}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ldesc{font-size:12.5px;font-weight:500;}
.lsub{font-size:10.5px;color:var(--mut);}
.ldata{font-size:11px;color:var(--mut);}
.lval{font-family:var(--fn);font-size:15px;font-weight:700;}
.add-lanc{border:2px dashed var(--brd);border-radius:9px;padding:13px;display:flex;flex-direction:column;gap:9px;margin-top:11px;}
/* FIREWORKS */
.rocket{position:fixed;pointer-events:none;z-index:9999;font-size:26px;animation:rfFly 1.2s ease-out forwards;}
@keyframes rfFly{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-220px) scale(.3);opacity:0;}}
.spark{position:fixed;pointer-events:none;z-index:9999;width:8px;height:8px;border-radius:50%;animation:spFly var(--d,.9s) ease-out forwards;}
@keyframes spFly{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--tx,0),var(--ty,0)) scale(0);opacity:0;}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}
@media(max-width:800px){.bcols{grid-template-columns:1fr;}.fr{grid-template-columns:1fr;}.fin-grid{grid-template-columns:1fr 1fr;}.exp-panel{grid-template-columns:1fr;}}
</style>

// HELPERS
function brl(n){return 'R$ '+Number(n).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function isBD(d){const w=d.getDay();if(w===0||w===6)return false;const k=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');return!FERIADOS.includes(k);}
function billingDate(y,m){let d=new Date(y,m,BD);while(!isBD(d))d.setDate(d.getDate()-1);return d;}
function addBizDays(d,n){let r=new Date(d);let c=0;while(c<Math.abs(n)){r.setDate(r.getDate()+(n>0?1:-1));if(isBD(r))c++;}return r;}
function nthBizDayOfMonth(y,m,n){let d=new Date(y,m,1);let c=0;while(c<n){if(isBD(d)){c++;if(c===n)break;}d.setDate(d.getDate()+1);}return d;}
function stCls(s){return{pendente:'s-p',enviado:'s-e',pago:'s-ok',atraso:'s-at'}[s]||'s-p';}
function stKey(id){return id+'-'+S.bYear+'-'+S.bMonth;}
function getSt(id){return S.statuses[stKey(id)]||'pendente';}
function setSt(id,v){S.statuses[stKey(id)]=v;save();render();}
function cobTag(c){const m={PIX_MENSAL:'t-pm',PIX_SEMESTRAL:'t-ps',BOLETO:'t-bo',SEM_COBRANCA:'t-sc'};return`<span class="tag ${m[c]}">${COBLBL[c]}</span>`;}
function sistImg(s){const k={DATACAIXA:'datacaixa',STI3:'sti3',VELO:'velo',PEDIZAP:'pedizap'}[s];return k&&LOGOS[k]?`<div class="si"><img src="${LOGOS[k]}" alt="${s}"></div>`:'';}
function automazeFee(c){return c.valor-Object.values(c.valores_sistemas||{}).reduce((a,b)=>a+Number(b),0);}
function parseDt(s){
  if(!s||typeof s!=='string')return null;
  const parts=s.trim().split('/');
  if(parts.length!==3)return null;
  const d=parseInt(parts[0],10),m=parseInt(parts[1],10),y=parseInt(parts[2],10);
  if(isNaN(d)||isNaN(m)||isNaN(y))return null;
  if(y<1990||y>2100||m<1||m>12||d<1||d>31)return null;
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  return dt;
}

// PARCERIA
function tempoParceria(dt){
  if(!dt||dt.toLowerCase().includes('confirmar')||dt.toLowerCase().includes('pend'))return null;
  const ini=parseDt(dt);if(!ini)return null;
  const h=new Date();
  let a=h.getFullYear()-ini.getFullYear(),m=h.getMonth()-ini.getMonth(),d=h.getDate()-ini.getDate();
  if(d<0){m--;d+=new Date(h.getFullYear(),h.getMonth(),0).getDate();}
  if(m<0){a--;m+=12;}
  const pt=[];
  if(a>0)pt.push(a+(a===1?' ano':' anos'));
  if(m>0)pt.push(m+(m===1?' mês':' meses'));
  if(d>0&&a===0)pt.push(d+(d===1?' dia':' dias'));
  // Formatar data por extenso
  const nomes=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const dateStr=ini.getDate()+' de '+nomes[ini.getMonth()]+' de '+ini.getFullYear();
  return{date:dateStr,raw:dt,tempo:pt.join(', ')||'hoje'};
}

// CERT STATUS
function certStatus(dtStr){
  const v=parseDt(dtStr);if(!v)return null;
  const agora=new Date();agora.setHours(0,0,0,0);
  const vv=new Date(v);vv.setHours(0,0,0,0);
  const dias=Math.ceil((vv-agora)/(864e5));
  if(dias<0)return{dias,cls:'cert-exp',txt:`Vencido (${Math.abs(dias)}d)`};
  if(dias<=30)return{dias,cls:'cert-crit',txt:`⚠️ Vence em ${dias}d`};
  if(dias<=180)return{dias,cls:'cert-warn',txt:`Vence em ${dias}d`};
  return{dias,cls:'cert-ok',txt:`✓ Válido · ${dias}d`};
}

// NOTIFICATIONS
async function requestNotif(){
  if(!('Notification' in window)){alert('Navegador sem suporte a notificações.');return;}
  const p=await Notification.requestPermission();
  S.notifEnabled=(p==='granted');save();render();
  if(S.notifEnabled)checkNotif();
}
function notify(t,b,tag){
  if(!S.notifEnabled||Notification.permission!=='granted')return;
  new Notification(t,{body:b,icon:LOGOS.automaze,tag:tag||t});
}
function checkNotif(){
  const h=new Date(),d=h.getDate(),m=h.getMonth(),y=h.getFullYear();
  const bd=billingDate(y,m);
  // Billing: 3 biz days before
  const alerta=addBizDays(bd,-3);
  if(d===alerta.getDate()&&m===alerta.getMonth())
    notify('🔔 Cobranças em 3 dias úteis',`Prepare as mensagens PIX para o dia ${bd.toLocaleDateString('pt-BR')}.`,'billing');
  // System payments
  SYSPAY.forEach(sp=>{if(d===sp.dia)notify(`💳 ${sp.nome} vence hoje`,`Pague o ${sp.nome} (dia ${sp.dia}).`,sp.nome);});
  // Certs
  S.clients.filter(c=>c.ativo&&c.certVenc).forEach(c=>{
    const cs=certStatus(c.certVenc);
    if(cs&&cs.dias>=0&&cs.dias<=30)notify('📋 Certificado vencendo',`${c.nome}: ${cs.txt}.`,c.id+'_cert');
  });
  // Semi-annual boletos: 10 business days before Jan/Jul
  // January: alert in December around 15th
  // July: alert in June around 15th
  const jan10=new Date(y,11,1);let jan10bd=new Date(jan10);
  for(let i=0;i<20;i++){jan10bd=addBizDays(new Date(y+1,0,1),-10+i);if(jan10bd.getMonth()===11)break;}
  const jul10bd=addBizDays(new Date(y,6,1),-10);
  if(m===11&&d===jan10bd.getDate())notify('📄 Boletos semestrais em breve','Gere os 6 boletos de Janeiro para clientes Boleto. Vence em Janeiro!','sem_jan');
  if(m===5&&d===jul10bd.getDate())notify('📄 Boletos semestrais em breve','Gere os 6 boletos de Julho para clientes Boleto. Vence em Julho!','sem_jul');
  // XML: 1st and 5th biz day
  const bd1=nthBizDayOfMonth(y,m,1);
  const bd5=nthBizDayOfMonth(y,m,5);
  const xmlKey=`xml_notif_${y}_${m}`;
  if((d===bd1.getDate()||d===bd5.getDate())&&!S.statuses[xmlKey]){
    const manual=S.clients.filter(c=>c.ativo&&c.xmlEnvio==='MANUAL');
    if(manual.length){
      notify('📤 Envio de XML ao contador',`${manual.length} cliente(s) com XML manual para enviar.`,'xml');
    }
  }
}

function saveSupabaseConfig(){
  let rawUrl=(document.getElementById('sb-url')?.value||'').trim();
  // Strip common suffixes users accidentally paste
  rawUrl=rawUrl.replace(/\/rest\/v1\/?$/,'').replace(/\/$/, '');
  S.supabaseUrl=rawUrl;
  S.supabaseKey=(document.getElementById('sb-key')?.value||'').trim();
  LS.save('supabaseUrl',S.supabaseUrl);LS.save('supabaseKey',S.supabaseKey);
  document.getElementById('sb-modal')?.remove();
  if(S.supabaseUrl&&S.supabaseKey)syncToCloud();
  else render();
}

async function syncToCloud(){
  const {url,key}=getSupabase();
  if(!url||!key){openSupabaseConfig();return;}
  const payload={clients:S.clients,statuses:S.statuses,lancamentos:S.lancamentos,nextSeq:S.nextSeq,debts:S.debts,savedAt:new Date().toISOString()};
  try{
    const r=await fetch(url+'/rest/v1/automaze_data',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({id:'main',payload})
    });
    if(r.ok){
      S.driveSynced=true;render();
      showToast('☁️ Dados salvos na nuvem!','Sincronizado com Supabase.','var(--grn)');
      notify('☁️ Dados salvos na nuvem','Sincronização automática realizada.','cloud');
    }else{
      let err='';try{err=await r.text();}catch(e){}
      let msg='HTTP '+r.status;
      if(r.status===401)msg='Chave inválida (401)';
      else if(r.status===404)msg='Tabela não encontrada (404) — execute o SQL no Supabase';
      else if(r.status===0)msg='Sem conexão com a internet';
      showToast('❌ Erro ao salvar: '+msg,'Detalhes no console (F12).','var(--red)');
      console.error('Supabase error',r.status,err);
    }
  }catch(e){showToast('❌ Sem conexão','Verifique sua internet.','var(--red)');console.error(e);}
}

async function loadFromCloud(){
  const {url,key}=getSupabase();
  if(!url||!key){openSupabaseConfig();return;}
  try{
    const r=await fetch(url+'/rest/v1/automaze_data?id=eq.main&select=payload',{
      headers:{'apikey':key,'Authorization':'Bearer '+key}
    });
    if(!r.ok){showToast('❌ Erro ao carregar','Verifique a configuração.','var(--red)');return;}
    const arr=await r.json();
    if(!arr||!arr.length){showToast('⚠️ Nenhum dado na nuvem','Faça um upload primeiro.','var(--yel)');return;}
    const d=arr[0].payload;
    const dt=new Date(d.savedAt).toLocaleString('pt-BR');
    if(confirm('Carregar dados da nuvem?\nSalvo em: '+dt+'\n\nSubstituirá os dados locais.')){
      if(d.clients)S.clients=d.clients;
      if(d.statuses)S.statuses=d.statuses;
      if(d.lancamentos)S.lancamentos=d.lancamentos;
      if(d.nextSeq)S.nextSeq=d.nextSeq;
      if(d.debts)S.debts=d.debts;
      save();render();
      showToast('✓ Dados carregados!','Sincronizado com sucesso.','var(--grn)');
    }
  }catch(e){showToast('❌ Sem conexão','Verifique sua internet.','var(--red)');console.error(e);}
}

function payDebt(clientId,debtId,ev,skipConfirm){
  if(ev)ev.stopPropagation();
  const debt=(S.debts[clientId]||[]).find(x=>x.id===debtId);

  const c=S.clients.find(x=>x.id===clientId);

  const now=new Date();

  const lanc={
    id:'l'+Date.now(),
    tipo:'receita',
    desc:debt.desc+(c?' — '+(c.nome.split(' ')[0]):''),
    valor:debt.valor,
    data:now.toLocaleDateString('pt-BR'),
    mes:now.getMonth(),
    ano:now.getFullYear(),
    clientId,
    origem:'debito',
    debtId
  };
  if(!S.lancamentos)S.lancamentos=[];
  S.lancamentos.push(lanc);

// JUROS/MULTA
function calcJuros(v,dias,ap=true){
  if(dias<=0)return{total:v,multa:0,juros:0};
  const m=ap?v*.02:0,j=ap?v*.01/30*dias:0;
  return{total:parseFloat((v+m+j).toFixed(2)),multa:parseFloat(m.toFixed(2)),juros:parseFloat(j.toFixed(2))};
}
function diasAtraso(){
  const bd=billingDate(S.bYear,S.bMonth),h=new Date();
  return h>bd?Math.floor((h-bd)/864e5):0;
}

// XML
function xmlKey(id){
  const n=new Date();
  return id+'_xml_'+n.getFullYear()+'_'+n.getMonth();
}
// Reset XML status para novo mês automaticamente
function checkXmlReset(){
  const n=new Date();
  const curKey='xmlResetCheck_'+n.getFullYear()+'_'+n.getMonth();
  if(!S.statuses[curKey]){
    // Novo mês — os xmlKeys antigos ficam com chave diferente, então já se "zera" automaticamente
    S.statuses[curKey]=true;save();
  }
}
function getXmlData(id){
  const v=S.statuses[xmlKey(id)];
  if(!v)return{sent:false,date:null};
  if(typeof v==='object')return v;
  return{sent:true,date:null}; // legacy boolean
}
function toggleXml(id,ev){
  if(ev)ev.stopPropagation();
  const cur=getXmlData(id);
  if(cur.sent){
    S.statuses[xmlKey(id)]={sent:false,date:null};
  }else{
    const now=new Date();
    const dateStr=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    S.statuses[xmlKey(id)]={sent:true,date:dateStr};
  }
  save();render();
}

// MÁSCARAS
function maskPhone(v){
  v=v.replace(/\D/g,'');
  if(v.length>11)v=v.slice(0,11);
  if(v.length>10)return v.replace(/^(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3');
  if(v.length>6)return v.replace(/^(\d{2})(\d{4,5})(\d{0,4})$/,'($1) $2-$3');
  if(v.length>2)return v.replace(/^(\d{2})(\d+)$/,'($1) $2');
  return v;
}
function maskDate(v){
  v=v.replace(/\D/g,'');
  if(v.length>8)v=v.slice(0,8);
  if(v.length>4)return v.replace(/^(\d{2})(\d{2})(\d{0,4})$/,'$1/$2/$3');
  if(v.length>2)return v.replace(/^(\d{2})(\d+)$/,'$1/$2');
  return v;
}
function applyMask(el,type){
  if(!el)return;
  el.addEventListener('input',function(){
    const pos=this.selectionStart;
    const old=this.value;
    this.value=type==='phone'?maskPhone(this.value):maskDate(this.value);
    // Adjust cursor
    const diff=this.value.length-old.length;
    this.setSelectionRange(pos+diff,pos+diff);
  });
  el.addEventListener('blur',function(){
    this.value=type==='phone'?maskPhone(this.value):maskDate(this.value);
  });
}

function filtered(){

function collectAndSave(){
  const e=S.editing;
  const get=id=>{const el=document.getElementById(id);return el?el.value:'';};
  e.nome=get('fn').toUpperCase().trim();
  if(!e.nome){alert('Nome obrigatório');return;}
  e.responsaveis=get('fr').split('/').map(x=>x.trim()).filter(Boolean);
  e.wpp=get('fw').trim();e.email=get('fe').trim();e.cnpj=get('fc').trim();
  e.valor=parseFloat(get('fv'))||0;e.cobranca=get('fcob');
  e.inicio=get('fi').trim();e.certVenc=get('fce').trim();
  e.xmlEnvio=get('fxml');e.pasta=get('fpasta').trim();e.obs=get('fo').trim();
  const sists=['DATACAIXA','STI3','VELO','PEDIZAP'];
  e.sistemas=sists.filter(s=>document.getElementById('sch-'+s)?.checked);
  e.valores_sistemas={};
  e.sistemas.forEach(s=>{e.valores_sistemas[s]=parseFloat(get('sv-'+s))||0;});
  if(S.modal==='add'){
    const newId='c'+String(S.nextSeq).padStart(3,'0');
    S.clients.push({...e,id:newId,seq:S.nextSeq});
    S.nextSeq++;
    save();closeModal();
    setTimeout(()=>celebrate(window.innerWidth/2,window.innerHeight/2),80);
  }else{
    const idx=S.clients.findIndex(x=>x.id===e.id);
    if(idx>=0)S.clients[idx]={...e};
    save();closeModal();
  }
}

function toggleSist(s){
  const e=S.editing;
  // Read current form values before re-render
  const fields=['fn','fr','fw','fe','fc','fv','fi','fce','fpasta','fo','fcob','fxml'];
  const vals={};fields.forEach(id=>{const el=document.getElementById(id);if(el)vals[id]=el.value;});
  const svVals={};['DATACAIXA','STI3','VELO','PEDIZAP'].forEach(k=>{const el=document.getElementById('sv-'+k);if(el)svVals[k]=el.value;});
  if(e.sistemas.includes(s))e.sistemas=e.sistemas.filter(x=>x!==s);
  else e.sistemas.push(s);
  render();

  setTimeout(()=>{
    fields.forEach(id=>{const el=document.getElementById(id);if(el&&vals[id]!=null)el.value=vals[id];});
    ['DATACAIXA','STI3','VELO','PEDIZAP'].forEach(k=>{const el=document.getElementById('sv-'+k);if(el&&svVals[k]!=null)el.value=svVals[k];});
  },0);
}

  ${S.modal?renderModal():''}`;
}

// ── RENDER MODAL ─────────────────────────────────────────────────────────────
function renderModal(){
  const e=S.editing;const isAdd=S.modal==='add';
  const sists=['DATACAIXA','STI3','VELO','PEDIZAP'];
  const sistChecks=sists.map(s=>`
    <div class="sch${e.sistemas.includes(s)?' on':''}" onclick="toggleSist('${s}')">
      <input type="checkbox" id="sch-${s}" ${e.sistemas.includes(s)?'checked':''} onclick="event.stopPropagation()">
      <img src="${LOGOS[s.toLowerCase()]||''}" alt="${s}" style="height:15px;max-width:56px;object-fit:contain;pointer-events:none;">
    </div>
    ${e.sistemas.includes(s)?`<div class="fg" style="min-width:90px;"><label class="flbl">Valor ${s}</label><input class="fin" id="sv-${s}" type="number" value="${e.valores_sistemas?.[s]||0}" step="0.01" style="padding:5px 8px;"></div>`:''}`
  ).join('');

  return `<div class="ov" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="mhdr"><div class="mtit">${isAdd?'Novo cliente':'Editar cliente'}</div><button class="btn btn-g btn-sm" onclick="closeModal()">✕</button></div>
      <div class="mbdy">
        <div class="fr">
          <div class="sdiv">Empresa</div>
          <div class="fg full"><label class="flbl">Nome *</label><input class="fin" id="fn" value="${e.nome||''}" placeholder="NOME DA EMPRESA"></div>
          <div class="fg full"><label class="flbl">Responsável(is) — separe por /</label><input class="fin" id="fr" value="${e.responsaveis.join(' / ')}" placeholder="JOÃO / MARIA"></div>
          <div class="fg"><label class="flbl">WhatsApp</label><input class="fin" id="fw" value="${e.wpp||''}" placeholder="(11) 99999-0000"></div>
          <div class="fg"><label class="flbl">Email</label><input class="fin" id="fe" value="${e.email||''}" placeholder="email@cliente.com"></div>
          <div class="fg"><label class="flbl">CNPJ</label><input class="fin" id="fc" value="${e.cnpj||''}" placeholder="00.000.000/0000-00"></div>
          <div class="fg"><label class="flbl">Início</label><input class="fin" id="fi" value="${e.inicio||''}" placeholder="DD/MM/AAAA"></div>
          <div class="fg"><label class="flbl">Pasta do cliente</label><input class="fin" id="fpasta" value="${e.pasta||''}" placeholder="Ex: C:\\Clientes\\NOME"></div>
          <div class="fg"><label class="flbl">Cert. digital vencimento</label><input class="fin" id="fce" value="${e.certVenc||''}" placeholder="DD/MM/AAAA"></div>
          <div class="fg"><label class="flbl">XML ao contador</label>
            <select class="fsel" id="fxml">
              <option value="NAO_ENVIA"${e.xmlEnvio==='NAO_ENVIA'?' selected':''}>Não envia</option>
              <option value="AUTOMATICO"${e.xmlEnvio==='AUTOMATICO'?' selected':''}>Automático</option>
              <option value="MANUAL"${e.xmlEnvio==='MANUAL'?' selected':''}>Manual</option>
            </select>
          </div>
        </div>
        <div class="fr">
          <div class="sdiv">Sistemas e licenças</div>
          <div class="sch-row">${sistChecks}</div>
        </div>
        <div class="fr">
          <div class="sdiv">Cobrança</div>
          <div class="fg"><label class="flbl">Valor total (R$)</label><input class="fin" id="fv" type="number" value="${e.valor||0}" step="0.01"></div>
          <div class="fg"><label class="flbl">Forma</label>
            <select class="fsel" id="fcob">${Object.entries(COBLBL).map(([k,v])=>`<option value="${k}"${e.cobranca===k?' selected':''}>${v}</option>`).join('')}</select>
          </div>
          <div class="fg full"><label class="flbl">Observações</label><input class="fin" id="fo" value="${e.obs||''}" placeholder="Notas internas"></div>
        </div>
      </div>
      <div class="mftr"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="collectAndSave()">${isAdd?'Cadastrar':'Salvar'}</button></div>
    </div>
  </div>`;
}

// ── RENDER COBRANÇA ──────────────────────────────────────────────────────────
function renderCobranca(){
  const m=S.bMonth,y=S.bYear;
  const bd=billingDate(y,m);const bds=bd.toLocaleDateString('pt-BR');
  const isJJ=m===0||m===6;
  // Sort alphabetically
  const sortAlpha=arr=>[...arr].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const pix=sortAlpha(S.clients.filter(c=>c.ativo&&c.cobranca==='PIX_MENSAL'));
  const pixS=sortAlpha(S.clients.filter(c=>c.ativo&&c.cobranca==='PIX_SEMESTRAL'));
  const bol=sortAlpha(S.clients.filter(c=>c.ativo&&c.cobranca==='BOLETO'));
  const sem=S.clients.filter(c=>c.ativo&&c.cobranca==='SEM_COBRANCA');
  const tPix=pix.reduce((s,c)=>s+Number(c.valor),0);
  const tPixS=pixS.reduce((s,c)=>s+Number(c.valor),0);
  const tBol=bol.reduce((s,c)=>s+Number(c.valor),0);
  const tMes=tPix+(isJJ?tPixS+tBol:0);

  function pInfo(list){const p=list.filter(c=>getSt(c.id)==='pago').length;return`<span style="font-size:10px;color:var(--mut);">${p}/${list.length} pagos</span>`;}

  function bRow(c,showWpp){
    const st=getSt(c.id);
    return`<div class="bitem">
      <div style="flex:1;"><div class="bname">${c.nome}</div><div class="bresp">${c.responsaveis[0]||''}</div></div>
      <div class="bval">${brl(c.valor)}</div>
      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0;">
        <select class="ssel ${stCls(st)}" onchange="setSt('${c.id}',this.value)">
          <option value="pendente"${st==='pendente'?' selected':''}>Pendente</option>
          <option value="enviado"${st==='enviado'?' selected':''}>Enviado</option>
          <option value="pago"${st==='pago'?' selected':''}>Pago</option>
          <option value="atraso"${st==='atraso'?' selected':''}>Em atraso</option>
        </select>
        ${showWpp?`<button class="wbtn" onclick="sendWpp('${c.id}')" ${!c.wpp?'disabled':''}>PIX</button>`:''}
        ${st==='atraso'?`<button class="btn btn-d btn-sm" onclick="openAtrasoModal('${c.id}')">⚠️</button>`:''}
      </div>
    </div>`;
  }
  function bFoot(t){return`<div class="bfoot"><span style="font-size:10px;color:var(--mut);">TOTAL </span><span style="font-family:var(--fn);font-size:15px;font-weight:700;color:var(--navy2);">${brl(t)}</span></div>`;}

  // System payment panel
  const hoje=new Date().getDate();
  const sysPanel=SYSPAY.map(sp=>{
    const diff=sp.dia-hoje;
    let badge=diff<0?`<span class="tag t-no">Vencido</span>`:diff===0?`<span class="cert-crit">HOJE</span>`:diff<=3?`<span class="tag t-warn">Em ${diff}d</span>`:`<span class="tag t-ok">Dia ${sp.dia}</span>`;
    return`<div style="display:flex;align-items:center;gap:9px;padding:6px 13px;border-top:1px solid var(--brd);"><div class="si"><img src="${LOGOS[sp.logo]}" alt="${sp.nome}"></div><div style="flex:1;font-size:12px;font-weight:600;">${sp.nome}</div><div style="font-size:11px;color:var(--mut);">Dia ${sp.dia}</div>${badge}</div>`;
  }).join('');

  return`
  <div class="bhdr">
    <div class="mnav"><button class="mnb" onclick="chgMonth(-1)">‹</button><div class="mdisp">${MESES[m]} ${y}</div><button class="mnb" onclick="chgMonth(1)">›</button></div>
    <div style="display:flex;gap:6px;align-items:center;"><span style="font-size:11px;color:var(--mut);">Total esperado:</span><span style="font-family:var(--fn);font-size:21px;font-weight:700;color:var(--navy2);">${brl(tMes)}</span></div>
  </div>
  ${isJJ?`<div class="alrt a-g"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div><b>${m===0?'Janeiro':'Julho'} — Mês de boletos!</b> Imprima e entregue os 6 boletos por cliente. Vencimento billing: <b>${bds}</b>.</div></div>`
  :`<div style="font-size:11px;color:var(--mut);margin-bottom:10px;padding:7px 11px;background:var(--pale);border-radius:7px;border:1px solid var(--brd);">📅 Vencimento: <b>${bds}</b></div>`}
  <div style="background:var(--wh);border:1px solid var(--brd);border-radius:10px;overflow:hidden;margin-bottom:11px;">
    <div style="padding:8px 13px;border-bottom:1px solid var(--brd);background:var(--pale);font-weight:700;font-size:12px;color:var(--navy2);display:flex;align-items:center;gap:6px;">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Pagamentos sistemas
    </div>${sysPanel}
  </div>
  <div class="bcols${isJJ?'':' '}">
    <div class="bsec"><div class="bsh"><div class="bst"><span style="color:#1a4f8a;font-size:16px;">●</span>PIX Mensal</div><div style="display:flex;gap:7px;align-items:center;">${pInfo(pix)}<span style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--mut);">${pix.length}</span></div></div>
      ${pix.map(c=>bRow(c,true)).join('')}${bFoot(tPix)}</div>
    ${isJJ?`
    <div class="bsec"><div class="bsh"><div class="bst"><span style="color:var(--grn);font-size:16px;">●</span>Boleto Semestral</div><div style="display:flex;gap:7px;align-items:center;">${pInfo(bol)}<span style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--mut);">${bol.length}</span></div></div>
      ${bol.map(c=>bRow(c,false)).join('')}${bFoot(tBol)}</div>
    <div class="bsec">
      <div class="bsh">
        <div class="bst"><span style="color:var(--yel);font-size:16px;">●</span>PIX Semestral ${isJJ?'<span style="font-size:9px;background:var(--yell);color:var(--yel);border:1px solid var(--yelb);border-radius:6px;padding:1px 6px;margin-left:4px;">COBRAR AGORA</span>':''}</div>
        <div style="display:flex;gap:7px;align-items:center;">
          ${pInfo(pixS)}
          <span style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--mut);">${pixS.length}</span>
          ${isJJ&&pixS.length?`<button class="btn btn-grn btn-sm" onclick="markAllSemestral()" title="Marcar todos como enviado">📲 Avisar todos</button>`:''}
        </div>
      </div>
      ${pixS.map(c=>bRow(c,true)).join('')}${bFoot(tPixS)}</div>
    `:`
    <div class="bsec"><div class="bsh"><div class="bst"><span style="color:var(--grn);font-size:16px;">●</span>Boleto — Verificar pagamentos</div><span style="font-family:var(--fn);font-size:17px;font-weight:700;color:var(--mut);">${bol.length}</span></div>
      ${bol.map(c=>{const st=getSt(c.id);return`<div class="bitem"><div style="flex:1;"><div class="bname" style="font-size:11.5px;">${c.nome}</div></div><div class="bval">${brl(c.valor)}</div><select class="ssel ${stCls(st)}" onchange="setSt('${c.id}',this.value)"><option value="pendente">Pendente</option><option value="enviado">Enviado</option><option value="pago"${st==='pago'?' selected':''}>Pago</option><option value="atraso">Em atraso</option></select></div>`;}).join('')}
      <div class="bfoot"><span style="font-size:10.5px;color:var(--mut);">Boletos entregues em Jan/Jul · Marque como pago ao receber</span></div>
    </div>`}
  </div>
  ${sem.length?`<div style="margin-top:9px;padding:8px 12px;background:var(--pale);border-radius:8px;border:1px solid var(--brd);font-size:11.5px;color:var(--mut);">Sem cobrança: ${sem.map(c=>c.nome).join(', ')}</div>`:''}`;
}
function chgMonth(d){S.bMonth+=d;if(S.bMonth>11){S.bMonth=0;S.bYear++;}if(S.bMonth<0){S.bMonth=11;S.bYear--;}render();}
function markAllSemestral(){
  const pixS=S.clients.filter(c=>c.ativo&&c.cobranca==='PIX_SEMESTRAL');
  if(!pixS.length)return;
  if(!confirm(`Enviar cobrança PIX via WhatsApp para todos os ${pixS.length} clientes PIX Semestral?`))return;
  pixS.forEach(c=>{if(c.wpp)sendWpp(c.id);else setSt(c.id,'enviado');});
  render();
}

// ── RENDER FINANCEIRO ────────────────────────────────────────────────────────
function renderFinanceiro(){
  const m=S.fMonth,y=S.fYear;
  const lancs=getLancsMes(y,m);
  const rec=lancs.filter(l=>l.tipo.startsWith('RECEITA'));
  const desp=lancs.filter(l=>l.tipo.startsWith('DESPESA'));
  const tR=rec.reduce((s,l)=>s+l.valor,0),tD=desp.reduce((s,l)=>s+l.valor,0);
  const lucro=tR-tD;
  const previsto=S.clients.filter(c=>c.ativo&&c.cobranca!=='SEM_COBRANCA').reduce((s,c)=>s+c.valor,0);
  const sugg=S.clients.filter(c=>{
    const st=S.statuses[c.id+'-'+y+'-'+m];
    return st==='pago'&&!lancs.find(l=>l.clientId===c.id&&l.tipo==='RECEITA_CLIENTE');
  });

  const lancRows=lancs.map(l=>{
    const iR=l.tipo.startsWith('RECEITA');
    const cl=l.clientId?S.clients.find(x=>x.id===l.clientId):null;
    return`<div class="lanc-row">
      <div class="ldot" style="background:${iR?'var(--grn)':'var(--red)'};"></div>
      <div><div class="ldesc">${l.desc}</div>${cl?`<div class="lsub">${cl.nome}</div>`:''}</div>
      <div class="ldata">${l.data}</div>
      <div class="lval" style="color:${iR?'var(--grn)':'var(--red)'};">${iR?'+':'-'}${brl(l.valor)}</div>
      <button class="btn btn-g btn-sm" onclick="removeLancamento('${l.id}')" style="padding:3px 7px;font-size:12px;">✕</button>
    </div>`;
  }).join('');

  return`
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:9px;">
    <div class="mnav"><button class="mnb" onclick="chgFM(-1)">‹</button><div class="mdisp">${MESES[m]} ${y}</div><button class="mnb" onclick="chgFM(1)">›</button></div>
  </div>
  <div class="fin-grid">
    <div class="fcrd"><div class="fcrd-l">Receitas</div><div class="fcrd-v" style="color:var(--grn);">${brl(tR)}</div><div class="fcrd-n">${rec.length} lançamentos</div></div>
    <div class="fcrd"><div class="fcrd-l">Despesas</div><div class="fcrd-v" style="color:var(--red);">${brl(tD)}</div><div class="fcrd-n">${desp.length} lançamentos</div></div>
    <div class="fcrd dest"><div class="fcrd-l">Lucro líquido</div><div class="fcrd-v" style="color:${lucro>=0?'var(--blue)':'var(--red)'};">${brl(lucro)}</div><div class="fcrd-n">${lucro>=0?'Positivo':'Negativo'}</div></div>
    <div class="fcrd"><div class="fcrd-l">Previsto/mês</div><div class="fcrd-v" style="font-size:16px;">${brl(previsto)}</div><div class="fcrd-n">todos ativos</div></div>
  </div>
  ${sugg.length?`<div style="background:var(--grnl);border:1px solid var(--grnb);border-radius:9px;padding:11px 13px;margin-bottom:13px;">
    <div style="font-size:10px;font-weight:700;color:var(--grn);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;">✓ Pagamentos recebidos — registrar</div>
    <div style="display:flex;flex-direction:column;gap:5px;">${sugg.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:5px 9px;background:var(--wh);border-radius:6px;font-size:12px;"><b>${c.nome}</b><div style="display:flex;gap:7px;align-items:center;"><span style="font-family:var(--fn);font-size:14px;font-weight:700;color:var(--grn);">${brl(c.valor)}</span><button class="btn btn-grn btn-sm" onclick="addLancamento('RECEITA_CLIENTE','Mensalidade ${MESES[m]}',${c.valor},'${c.id}','${new Date().toLocaleDateString('pt-BR')}')">+ Registrar</button></div></div>`).join('')}</div>
  </div>`:''}
  <div style="background:var(--wh);border:1px solid var(--brd);border-radius:10px;overflow:hidden;margin-bottom:13px;">
    <div style="padding:9px 13px;border-bottom:1px solid var(--brd);background:var(--pale);display:flex;align-items:center;justify-content:space-between;"><span style="font-weight:700;font-size:12px;">Lançamentos — ${MESES[m]}</span><span style="font-size:11px;color:var(--mut);">${lancs.length} lançamentos</span></div>
    ${lancs.length?lancRows:'<div style="padding:20px;text-align:center;color:var(--mut);font-size:12px;font-style:italic;">Nenhum lançamento</div>'}
  </div>
  <div class="add-lanc">
    <div style="font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;">+ Novo lançamento</div>
    <div class="fr">
      <div class="fg"><label class="flbl">Tipo</label>
        <select class="fsel" id="ltype">
          <option value="RECEITA_CLIENTE">Receita — Cliente</option>
          <option value="RECEITA_AVULSA">Receita — Instalação/Serviço</option>
          <option value="DESPESA_SISTEMA">Despesa — Sistema</option>
          <option value="DESPESA_OUTROS">Despesa — Outros</option>
        </select>
      </div>
      <div class="fg"><label class="flbl">Cliente (opcional)</label>
        <select class="fsel" id="lcli"><option value="">— nenhum —</option>${S.clients.filter(c=>c.ativo).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select>
      </div>
      <div class="fg full"><label class="flbl">Descrição</label><input class="fin" id="ldesc" placeholder="Ex: Mensalidade, Instalação…"></div>
      <div class="fg"><label class="flbl">Valor (R$)</label><input class="fin" id="lval" type="number" placeholder="0,00" step="0.01"></div>
      <div class="fg"><label class="flbl">Data</label><input class="fin" id="ldata" value="${new Date().toLocaleDateString('pt-BR')}" placeholder="DD/MM/AAAA"></div>
    </div>
    <button class="btn btn-p btn-sm" onclick="submitLanc()">Registrar lançamento</button>
  </div>`;
}
function chgFM(d){S.fMonth+=d;if(S.fMonth>11){S.fMonth=0;S.fYear++;}if(S.fMonth<0){S.fMonth=11;S.fYear--;}render();}
function submitLanc(){
  const tipo=document.getElementById('ltype')?.value;
  const desc=document.getElementById('ldesc')?.value?.trim();
  const val=document.getElementById('lval')?.value;
  const cli=document.getElementById('lcli')?.value;
  const data=document.getElementById('ldata')?.value;
  if(!desc||!val||parseFloat(val)<=0){alert('Preencha descrição e valor.');return;}
  addLancamento(tipo,desc,val,cli,data);
}

function bindEvents(){
  const s=document.getElementById('srch');
  if(s)s.addEventListener('input',e=>{clearTimeout(S._st);S._st=setTimeout(()=>{S.search=e.target.value;render();},220);});
}

// INIT
document.getElementById('root').innerHTML=`
  <div class="hdr">
    <div class="hdr-l">
      <img src="${LOGOS.automaze}" class="hdr-logo" onclick="toggleSummary()" title="">
      <div><div class="hdr-nm">AUTOMAZE TEC</div><div class="hdr-sb">Controle · ${new Date().getFullYear()}</div></div>
      <div class="vsep"></div>
      <div class="nav">
        <button class="nb on" id="nt-clientes" onclick="setTab('clientes')">👥 Clientes</button>
        <button class="nb" id="nt-cobranca" onclick="setTab('cobranca')">💳 Cobranças</button>
        <button class="nb" id="nt-financeiro" onclick="setTab('financeiro')">💰 Financeiro</button>
      </div>
    </div>
    <div class="hdr-r">
      <span id="save-ind" style="font-size:10px;color:var(--grn);opacity:0;transition:opacity .4s;margin-right:4px;white-space:nowrap;">✓ salvo</span>
      <div class="dbadge" id="dbadge" style="display:none;">carregando...</div>
      <button class="hdr-btn" id="notif-btn" onclick="requestNotif()">🔕 Notificações</button>
      <button class="hdr-btn drive" id="drive-btn" onclick="syncToCloud()" title="Salvar na nuvem (Supabase)">☁️ Salvar nuvem</button>
      <button class="hdr-btn" id="drive-load-btn" onclick="loadFromCloud()" style="font-size:10px;" title="Carregar da nuvem">📥 Carregar</button>
      <button class="hdr-btn" onclick="openSupabaseConfig()" style="font-size:10px;" title="Configurar Supabase">⚙️ Nuvem</button>
    </div>
  </div>
  <div class="pg" id="content"></div>`;

checkXmlReset();
render();
// loadGapi(); // Supabase replaces Google Drive
if(S.notifEnabled)setTimeout(checkNotif,2000);
setInterval(()=>{if(S.notifEnabled)checkNotif();},3600000);

</script>
</body>
</html>
